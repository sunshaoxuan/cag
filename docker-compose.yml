services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-same-origin}
    environment:
      CAG_GATEWAY_UPSTREAM: ${CAG_GATEWAY_UPSTREAM:-host.docker.internal:8000}
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AGENT_GATEWAY_ENVIRONMENT: container
      AGENT_GATEWAY_PROCESS_ROLE: api
      AGENT_GATEWAY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_gateway}:${POSTGRES_PASSWORD:-agent_gateway}@postgres:5432/${POSTGRES_DB:-agent_gateway}
      AGENT_GATEWAY_REDIS_URL: redis://redis:6379/0
      AGENT_GATEWAY_RUNTIME_PROVIDER: fake
      AGENT_GATEWAY_KNOWLEDGE_ENABLED: "false"
      AGENT_GATEWAY_KNOWLEDGE_SOURCES_DIR: /workspaces/.knowledge-sources
      AGENT_GATEWAY_AUTO_CREATE_SCHEMA: "false"
      AGENT_GATEWAY_PROJECTS_DIR: /projects
      AGENT_GATEWAY_WORKSPACE_ROOT: /workspaces
      AGENT_GATEWAY_FAKE_RUNTIME_DELAY_MS: ${AGENT_GATEWAY_FAKE_RUNTIME_DELAY_MS:-25}
      AGENT_GATEWAY_LOG_LEVEL: ${AGENT_GATEWAY_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - agent_gateway_workspaces:/workspaces

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - -m
      - app.worker
    environment:
      AGENT_GATEWAY_ENVIRONMENT: container
      AGENT_GATEWAY_PROCESS_ROLE: worker
      AGENT_GATEWAY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_gateway}:${POSTGRES_PASSWORD:-agent_gateway}@postgres:5432/${POSTGRES_DB:-agent_gateway}
      AGENT_GATEWAY_REDIS_URL: redis://redis:6379/0
      AGENT_GATEWAY_RUNTIME_PROVIDER: fake
      AGENT_GATEWAY_KNOWLEDGE_ENABLED: "false"
      AGENT_GATEWAY_KNOWLEDGE_SOURCES_DIR: /workspaces/.knowledge-sources
      AGENT_GATEWAY_AUTO_CREATE_SCHEMA: "false"
      AGENT_GATEWAY_PROJECTS_DIR: /projects
      AGENT_GATEWAY_WORKSPACE_ROOT: /workspaces
      AGENT_GATEWAY_FAKE_RUNTIME_DELAY_MS: ${AGENT_GATEWAY_FAKE_RUNTIME_DELAY_MS:-25}
      AGENT_GATEWAY_LOG_LEVEL: ${AGENT_GATEWAY_LOG_LEVEL:-INFO}
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - agent_gateway_workspaces:/workspaces

  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-agent_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_gateway}
    volumes:
      - agent_gateway_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-agent_gateway} -d ${POSTGRES_DB:-agent_gateway}"
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - agent_gateway_redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    container_name: ollama
    profiles:
      - knowledge
    image: ollama/ollama:0.23.3
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    restart: unless-stopped

volumes:
  agent_gateway_postgres:
  agent_gateway_redis:
  agent_gateway_workspaces:
  ollama_models:
    external: true
    name: ollama
