[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.22.5"
description = "Gateway for locally authenticated Codex agent tasks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.18,<2",
  "cryptography>=46,<47",
  "fastapi>=0.140,<1",
  "httpx>=0.28,<1",
  "keyring>=25.7,<26",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "pypdf>=6,<7",
  "pyyaml>=6.0.3,<7",
  "redis>=6,<7",
  "sqlalchemy>=2.0.51,<3",
  "tree-sitter-language-pack>=1.13.5,<2",
  "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
